version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing AWS SAM CLI"
      - pip install --upgrade pip
      - pip install aws-sam-cli

  pre_build:
    commands:
      - echo "Validating SAM template"
      - sam validate

  build:
    commands:
      - echo "Building SAM application"
      - sam build
      - echo "Deploying SAM application"
      - sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name quiz-aws-sam-s3-api --capabilities CAPABILITY_IAM --region us-east-1

artifacts:
  files:
    - "**/*"